<!DOCTYPE html>

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<script>
// Capturador global de errores: si algo falla, se ve en pantalla en vez de quedar en blanco.
window.addEventListener('error', function(ev){
  try{
    var msg = '⚠ Error de JavaScript: ' + (ev.message || 'ver consola') +
      (ev.filename ? ' — ' + ev.filename.split('/').pop() + ':' + ev.lineno + ':' + ev.colno : '');
    var box = document.getElementById('jsErrorBox');
    if (!box){
      box = document.createElement('div');
      box.id = 'jsErrorBox';
      box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#7a1f1f;color:#fff;'
        + 'padding:10px 14px;font:12px/1.5 monospace;white-space:pre-wrap;';
      document.documentElement.appendChild(box);
    }
    box.textContent += (box.textContent ? '\n' : '') + msg;
  }catch(_e){}
}, true);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

<body>
<div class="wrap">
  <div class="brand-header">
  <img src="icons/logo.png" alt="Autobuses El Poblado Laureles S.A. — Conectamos Propósitos">
  </div>
  <div class="hero">
    <div class="hero-top">
      <div class="hero-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2"/><path d="M12 3.5v5M12 15.5v5M4.6 7.6l3.6 3M15.8 13.4l3.6 3M19.4 7.6l-3.6 3M8.2 13.4l-3.6 3"/></svg>
      </div>
      <div>
        <p class="hero-eyebrow">PESV · Plan Estratégico de Seguridad Vial</p>
        <h1>Encuesta de caracterización</h1>
      </div>
    </div>
    <p class="sub">Recopila hábitos, condiciones de desplazamiento y percepción de riesgo vial de los colaboradores. La información es un insumo directo para el análisis del PESV.</p>

  <div class="road-progress" id="surveyProgressWrap">

  <div id="resultsView" style="display:none;"></div>
</div>
<script src="js/config.js"></script>
<script src="js/employees.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  // Cuando entra un service worker nuevo, recarga una sola vez para aplicar la versión
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return; refreshing = true; location.reload();
  });
  const activar = (reg) => {
    if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
    if (reg.installing) {
      reg.installing.addEventListener('statechange', function () {
        if (this.state === 'installed' && reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
      });
    }
  };
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      const upd = () => { try { const p = reg.update(); if (p && p.catch) p.catch(function () {}); } catch (e) {} };
      upd();
      activar(reg);
      reg.addEventListener('updatefound', () => activar(reg));
      setInterval(upd, 60000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) upd(); });
    }).catch(function () {});
  });
}
</script>
</body>
</html>
